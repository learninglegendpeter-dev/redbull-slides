       @font-face {\n            font-family: 'Aptos Display';\n            src: local('Aptos Display'), local('Arial');\n            font-weight: 700;\n        }\n        @font-face {\n            font-family: 'Aptos';\n            src: local('Aptos'), local('Arial');\n            font-weight: 400;\n        }\n        .font-aptos-display {\n            font-family: 'Aptos Display', 'Arial', sans-serif;\n        }\n        .font-aptos {\n            font-family: 'Aptos', 'Arial', sans-serif;\n        }\n        * {\n            text-shadow: none !important;\n            text-decoration: none !important;\n            box-sizing: border-box;\n        }\n        \n        /* Advanced particle system */\n        .particle {\n            position: absolute;\n            border-radius: 50%;\n            opacity: 0;\n            pointer-events: none;\n        }\n        \n        .particle-glow {\n            width: 6px;\n            height: 6px;\n            background: radial-gradient(circle, #F0D000 0%, transparent 70%);\n            box-shadow: 0 0 10px #F0D000;\n        }\n        \n        .particle-blue {\n            width: 4px;\n            height: 4px;\n            background: radial-gradient(circle, #0000B0 0%, transparent 70%);\n            box-shadow: 0 0 8px #0000B0;\n        }\n        \n        .particle-red {\n            width: 5px;\n            height: 5px;\n            background: radial-gradient(circle, #E01040 0%, transparent 70%);\n            box-shadow: 0 0 8px #E01040;\n        }\n        \n        /* Data flow lines with gradient trails */\n        .data-line {\n            position: absolute;\n            height: 3px;\n            opacity: 0;\n            pointer-events: none;\n        }\n        \n        .data-line-horizontal {\n            background: linear-gradient(90deg, transparent, #0000B0 20%, #F0D000 50%, #0000B0 80%, transparent);\n        }\n        \n        .data-line-vertical {\n            width: 3px;\n            background: linear-gradient(180deg, transparent, #E01040 20%, #F0D000 50%, #E01040 80%, transparent);\n        }\n        \n        /* RGB split glitch effect */\n        @keyframes rgb-split {\n            0%, 100% { \n                text-shadow: 0 0 0 transparent;\n                transform: translate(0);\n            }\n            20% { \n                text-shadow: -3px 0 0 rgba(255, 0, 0, 0.7), 3px 0 0 rgba(0, 255, 255, 0.7);\n                transform: translate(-2px, 0);\n            }\n            40% { \n                text-shadow: 3px 0 0 rgba(255, 0, 0, 0.7), -3px 0 0 rgba(0, 255, 255, 0.7);\n                transform: translate(2px, 0);\n            }\n            60% { \n                text-shadow: -2px 0 0 rgba(255, 0, 0, 0.5), 2px 0 0 rgba(0, 255, 255, 0.5);\n                transform: translate(0, -1px);\n            }\n            80% { \n                text-shadow: 2px 0 0 rgba(255, 0, 0, 0.5), -2px 0 0 rgba(0, 255, 255, 0.5);\n                transform: translate(0, 1px);\n            }\n        }\n        \n        .rgb-glitch {\n            animation: rgb-split 0.6s ease-in-out;\n        }\n        \n        /* Pulsing connection nodes */\n        .connection-node {\n            position: absolute;\n            width: 12px;\n            height: 12px;\n            border-radius: 50%;\n            background: #F0D000;\n            box-shadow: 0 0 15px #F0D000, 0 0 30px #F0D000;\n            opacity: 0;\n        }\n        \n        @keyframes node-pulse {\n            0%, 100% { \n                transform: scale(1);\n                box-shadow: 0 0 15px #F0D000, 0 0 30px #F0D000;\n            }\n            50% { \n                transform: scale(1.5);\n                box-shadow: 0 0 25px #F0D000, 0 0 50px #F0D000, 0 0 75px rgba(240, 208, 0, 0.5);\n            }\n        }\n        \n        .node-animate {\n            animation: node-pulse 2s ease-in-out infinite;\n        }\n        \n        /* 3D rotation glow */\n        @keyframes rotate-glow {\n      rotationY: 0, \n                rotationX: 0, \n                scale: 1, \n                autoAlpha: 1, \n                duration: 1.5, \n                ease: \"back.out(1.7)\",\n                onComplete: () => {\n                    gsap.to(\".anim-logo\", {\n                        rotationY: 360,\n                        duration: 20,\n                        repeat: -1,\n                        ease: \"none\"\n                    });\n                }\n            }\n        )\n        // Header with RGB split glitch\n        .fromTo(\".anim-header\", \n            { y: 50, autoAlpha: 0, scale: 0.9 }, \n            { \n                y: 0, \n                autoAlpha: 1, \n                scale: 1,\n                duration: 1, \n                ease: \"power3.out\",\n                onComplete: () => {\n                    const header = document.querySelector(\".anim-header h1\");\n                    header.classList.add(\"rgb-glitch\");\n                    setTimeout(() => {\n                        header.classList.remove(\"rgb-glitch\");\n                    }, 600);\n                }\n            },\n            \"-=0.8\"\n        )\n        // Digital grid fade in\n        .to(\"#digital-grid\", {\n            autoAlpha: 1,\n            duration: 0.8,\n            ease: \"power2.inOut\"\n        }, \"-=0.5\")\n        // Bullets with RGB glitch stagger\n        .add(() => {\n            const bullets = document.querySelectorAll(\".anim-bullet\");\n            bullets.forEach((bullet, index) => {\n                gsap.fromTo(bullet,\n                    { x: -80, autoAlpha: 0, scale: 0.8, rotationY: -45 },\n                    { \n                        x: 0, \n                        autoAlpha: 1, \n                        scale: 1,\n                        rotationY: 0,\n                        duration: 1, \n                        delay: index * 0.3,\n                        ease: \"power3.out\",\n                        onStart: () => {\n                            const title = bullet.querySelector(\"h3\");\n                            title.classList.add(\"rgb-glitch\");\n                        },\n                        onComplete: () => {\n                            const title = bullet.querySelector(\"h3\");\n                            setTimeout(() => {\n                                title.classList.remove(\"rgb-glitch\");\n                            }, 600);\n                        }\n                    }\n                );\n            });\n        }, \"-=0.6\")\n        // Image with 3D rotation and depth\n        .fromTo(\".anim-image\",\n            { \n                rotationY: 120, \n                rotationX: 30,\n                scale: 0.6, \n                autoAlpha: 0, \n                transformOrigin: \"center\",\n                z: -500\n            },\n            { \n                rotationY: 0, \n                rotationX: 0,\n                scale: 1, \n                autoAlpha: 1,\n                z: 0,\n                duration: 1.8, \n                ease: \"power4.out\",\n                onComplete: () => {\n                    createAdvancedParticles();\n                    createConnectionNodes();\n                    createScanlines();\n                }\n            },\n            \"-=1.2\"\n        )\n        // Footer with glitch\n        .fromTo(\".anim-footer\",\n            { autoAlpha: 0, y: 20, scale: 0.9 },\n            { \n                autoAlpha: 1, \n                y: 0, \n                scale: 1,\n                duration: 0.8, \n                stagger: 0.15, \n                ease: \"power2.out\" \n            },\n            \"-=1\"\n        );\n\n        // Advanced particle system with multiple types\n        function createAdvancedParticles() {\n            const container = document.getElementById(\"particle-container\");\n            const particleCount = 50;\n            \n            for (let i = 0; i < particleCount; i++) {\n                const particle = document.createElement(\"div\");\n                particle.className = \"particle\";\n                \n                // Randomly assign particle types\n                const types = [\"particle-glow\", \"particle-blue\", \"particle-red\"];\n                const randomType = types[Math.floor(Math.random() * types.length)];\n                particle.classList.add(randomType);\n                \n                const startX = Math.random() * 1280;\n                const startY = Math.random() * 720;\n                const endX = startX + (Math.random() - 0.5) * 300;\n                const endY = startY + (Math.random() - 0.5) * 300;\n                \n                particle.style.left = startX + \"px\";\n                particle.style.top = startY + \"px\";\n                \n                container.appendChild(particle);\n                \n                gsap.to(particle, {\n                    x: endX - startX,\n                    y: endY - startY,\n                    autoAlpha: 0.8,\n                    duration: 2 + Math.random() * 2,\n                    delay: i * 0.02,\n                    ease: \"sine.inOut\",\n                    onComplete: () => {\n                        gsap.to(particle, {\n                            autoAlpha: 0,\n                            scale: 0,\n                            duration: 0.8,\n                            onComplete: () => particle.remove()\n                        });\n                    }\n                });\n            }\n            \n            // Continuous particle generation\n            setInterval(() => {\n                if (document.getElementById(\"particle-container\").children.length < 30) {\n                    createContinuousParticles();\n                }\n            }, 500);\n        }\n\n        function createContinuousParticles() {\n            const container = document.getElementById(\"particle-container\");\n            const particle = document.createElement(\"div\");\n            particle.className = \"particle particle-glow\";\n            \n            const startX = 720 + Math.random() * 480;\n            const startY = 180 + Math.random() * 400;\n            const endX = startX + (Math.random() - 0.5) * 200;\n            const endY = startY + (Math.random() - 0.5) * 200;\n            \n            particle.style.left = startX + \"px\";\n            particle.style.top = startY + \"px\";\n            \n            container.appendChild(particle);\n            \n            gsap.to(particle, {\n                x: endX - startX,\n                y: endY - startY,\n                autoAlpha: 0.6,\n                duration: 3,\n                ease: \"sine.inOut\",\n                onComplete: () => {\n                    gsap.to(particle, {\n                        autoAlpha: 0,\n                        duration: 0.5,\n                        onComplete: () => particle.remove()\n                    });\n                }\n            });\n        }\n\n        // Create pulsing connection nodes\n        function createConnectionNodes() {\n            const nodesContainer = document.getElementById(\"nodes-container\");\n            const nodePositions = [\n                { x: 350, y: 250 },\n                { x: 650, y: 200 },\n                { x: 350, y: 400 },\n                { x: 650, y: 450 },\n                { x: 500, y: 325 },\n                { x: 900, y: 300 },\n                { x: 900, y: 500 }\n            ];\n            \n            nodePositions.forEach((pos, index) => {\n                const node = document.createElement(\"div\");\n                node.className = \"connection-node\";\n                node.style.left = pos.x + \"px\";\n                node.style.top = pos.y + \"px\";\n                \n                nodesContainer.appendChild(node);\n                \n                gsap.to(node, {\n                    autoAlpha: 1,\n                    duration: 0.5,\n                    delay: 1.5 + index * 0.1,\n                    ease: \"power2.out\",\n                    onComplete: () => {\n                        node.classList.add(\"node-animate\");\n                    }\n                });\n            });\n        }\n\n        // Create data flow lines with gradient trails\n        function createDataFlows() {\n            const dataflowContainer = document.getElementById(\"dataflow-container\");\n            \n            // Horizontal lines\n            for (let i = 0; i < 8; i++) {\n                const line = document.createElement(\"div\");\n                line.className = \"data-line data-line-horizontal\";\n                \n                const yPos = 200 + i * 60;\n                line.style.top = yPos + \"px\";\n                line.style.left = \"50px\";\n                line.style.width = \"0px\";\n                line.style.height = \"3px\";\n                \n                dataflowContainer.appendChild(line);\n                \n                gsap.to(line, {\n                    width: \"1180px\",\n                    autoAlpha: 0.7,\n                    duration: 2,\n                    delay: 1.8 + i * 0.15,\n                    ease: \"power2.inOut\",\n                    onComplete: () => {\n                        gsap.to(line, {\n                            autoAlpha: 0,\n                            duration: 1,\n                            onComplete: () => line.remove()\n                        });\n                    }\n                });\n            }\n            \n            // Vertical lines\n            for (let i = 0; i < 6; i++) {\n                const line = document.createElement(\"div\");\n                line.className = \"data-line data-line-vertical\";\n                \n                const xPos = 200 + i * 180;\n                line.style.left = xPos + \"px\";\n                line.style.top = \"150px\";\n                line.style.height = \"0px\";\n                line.style.width = \"3px\";\n                \n                dataflowContainer.appendChild(line);\n                \n                gsap.to(line, {\n                    height: \"500px\",\n                    autoAlpha: 0.6,\n                    duration: 1.8,\n                    delay: 2 + i * 0.12,\n                    ease: \"power2.inOut\",\n                    onComplete: () => {\n                        gsap.to(line, {\n                            autoAlpha: 0,\n                            duration: 1,\n                            onComplete: () => line.remove()\n                        });\n                    }\n                });\n            }\n        }\n\n        // Create scanline effects\n        function createScanlines() {\n            const scanlineContainer = document.getElementById(\"scanline-container\");\n            \n            function createScanline() {\n                const scanline = document.createElement(\"div\");\n                scanline.className = \"scanline\";\n                scanline.style.top = \"0px\";\n                \n                scanlineContainer.appendChild(scanline);\n                \n                gsap.to(scanline, {\n                    top: \"720px\",\n                    autoAlpha: 0.6,\n                    duration: 3,\n                    ease: \"none\",\n                    onComplete: () => {\n                        scanline.remove();\n                    }\n                });\n            }\n            \n            // Create initial scanlines\n            setTimeout(() => createScanline(), 2000);\n            setTimeout(() => createScanline(), 2500);\n            \n            // Continuous scanlines\n            setInterval(() => {\n                if (Math.random() > 0.5) {\n                    createScanline();\n                }\n            }, 4000);\n        }\n\n        // Trigger data flows\n        setTimeout(() => {\n            createDataFlows();\n        }, 1500);\n\n        // Continuous 3D rotation on image\n        gsap.to(\".anim-image\", {\n            rotationY: 5,\n            rotationX: 2,\n            duration: 4,\n            repeat: -1,\n            yoyo: true,\n            ease: \"sine.inOut\"\n        });\n\n        // Subtle scale pulse on image\n        gsap.to(\".anim-image img\", {\n            scale: 1.05,\n            duration: 3,\n            repeat: -1,\n            yoyo: true,\n            ease: \"sine.inOut\"\n        });\n\n        // Periodic RGB glitch on header\n        setInterval(() => {\n            const header = document.querySelector(\".anim-header h1\");\n            header.classList.add(\"rgb-glitch\");\n            setTimeout(() => {\n                header.classList.remove(\"rgb-glitch\");\n            }, 600);\n        }, 8000);\n    });\n<\/script>\n\n</body></html>","<!DOCTYPE html><html lang=\"en\"><head>\n    <meta charset=\"utf-8\">\n    <meta content=\"width=1280, initial-scale=1.0\" name=\"viewport\">\n    <title>Different Audiences. Different Feeds.</title>\n    <script src=\"assets/0e205e71e3e4.js\"><\/script>\n    <script src=\"assets/c86a68379fb4.js\"><\/script>\n    <link href=\"https://fonts.googleapis.com/css2?family=Aptos+Display:wght@400;700&amp;display=swap\" rel=\"stylesheet\">\n    <link href=\"https://fonts.googleapis.com/css2?family=Aptos:wght@400;700&amp;display=swap\" rel=\"stylesheet\">\n    <style>\n        @font-face {\n            font-family: 'Aptos Display';\n            src: local('Aptos Display'), local('Arial');\n            font-weight: 700;\n        }\n        @font-face {\n            font-family: 'Aptos';\n            src: local('Aptos'), local('Arial');\n            font-weight: 400;\n        }\n        .font-aptos-display {\n            font-family: 'Aptos Display', 'Arial', sans-serif;\n        }\n        .font-aptos {\n            font-family: 'Aptos', 'Arial', sans-serif;\n        }\n        * {\n            text-shadow: none !important;\n            text-decoration: none !importan d Animations\n        const tl = gsap.timeline();\n\n        // Logo - 3D rotation entrance with bounce\n        tl.fromTo(\".anim-logo\", \n            { rotationY: -180, rotationX: 45, scale: 0, autoAlpha: 0 }, \n            { rotationY: 0, rotationX: 0, scale: 1, autoAlpha: 1, duration: 1.2, ease: \"back.out(2)\" }\n        )\n\n        // Header - Cinematic slide with glow\n        .fromTo(\".anim-header\", \n            { x: -100, autoAlpha: 0, filter: \"blur(10px)\" }, \n            { x: 0, autoAlpha: 1, filter: \"blur(0px)\", duration: 1, ease: \"power3.out\" },\n            \"-=0.7\"\n        )\n        \n        // Text Block - Slide in with 3D perspective\n        .fromTo(\".anim-text-block\",\n            { x: -80, rotationY: -30, autoAlpha: 0, transformPerspective: 1000 },\n            { x: 0, rotationY: 0, autoAlpha: 1, duration: 1, ease: \"back.out(1.5)\" },\n            \"-=0.5\"\n        )\n\n        // List items - Stagger with scale and rotation\n        .fromTo(\".anim-list-item\",\n            { x: -30, scale: 0.8, rotation: -5, autoAlpha: 0 },\n            { x: 0, scale: 1, rotation: 0, autoAlpha: 1, duration: 0.6, stagger: 0.2, ease: \"back.out(2)\" },\n            \"-=0.6\"\n        )\n\n        // Center Hub - Explosive 3D pop with rotation and scale\n        .fromTo(\".anim-hub\",\n            { scale: 0, rotation: -360, z: -500, autoAlpha: 0, transformPerspective: 1000 },\n            { scale: 1, rotation: 0, z: 0, autoAlpha: 1, duration: 1.2, ease: \"back.out(2.5)\" },\n            \"-=0.4\"\n        )\n        \n        // Particle burst animation\n        .to(\".particle\", {\n            autoAlpha: 1,\n            duration: 0.1,\n            stagger: 0.05\n        }, \"-=0.8\")\n\n        // Arrow 1 - Draw with gradient flow and glow pulse\n        .fromTo(\".anim-arrow-1\",\n            { strokeDashoffset: 250, autoAlpha: 0, filter: \"blur(5px)\" },\n            { strokeDashoffset: 0, autoAlpha: 1, filter: \"blur(0px)\", duration: 0.9, ease: \"power2.out\" },\n            \"-=0.5\"\n        )\n\n        // Spoke 1 - 3D pop with bounce and rotation\n        .fromTo(\".anim-spoke-1\",\n            { scale: 0, y: 50, rotationX: -90, z: -200, autoAlpha: 0, transformPerspective: 1000 },\n            { scale: 1, y: 0, rotationX: 0, z: 0, autoAlpha: 1, duration: 0.8, ease: \"back.out(2.5)\" },\n            \"-=0.5\"\n        )\n\n        // Arrow 2 - Draw with enhanced effects\n        .fromTo(\".anim-arrow-2\",\n            { strokeDashoffset: 250, autoAlpha: 0, filter: \"blur(5px)\" },\n            { strokeDashoffset: 0, autoAlpha: 1, filter: \"blur(0px)\", duration: 0.9, ease: \"power2.out\" },\n            \"-=0.6\"\n        )\n\n        // Spoke 2 - 3D pop from different angle\n        .fromTo(\".anim-spoke-2\",\n            { scale: 0, y: 50, rotationX: -90, z: -200, autoAlpha: 0, transformPerspective: 1000 },\n            { scale: 1, y: 0, rotationX: 0, z: 0, autoAlpha: 1, duration: 0.8, ease: \"back.out(2.5)\" },\n            \"-=0.5\"\n        )\n\n        // Arrow 3 - Draw with gradient flow\n        .fromTo(\".anim-arrow-3\",\n            { strokeDashoffset: 250, autoAlpha: 0, filter: \"blur(5px)\" },\n            { strokeDashoffset: 0, autoAlpha: 1, filter: \"blur(0px)\", duration: 0.9, ease: \"power2.out\" },\n            \"-=0.6\"\n        )\n\n        // Spoke 3 - 3D pop with upward motion\n        .fromTo(\".anim-spoke-3\",\n            { scale: 0, y: -50, rotationX: 90, z: -200, autoAlpha: 0, transformPerspective: 1000 },\n            { scale: 1, y: 0, rotationX: 0, z: 0, autoAlpha: 1, duration: 0.8, ease: \"back.out(2.5)\" },\n            \"-=0.5\"\n        )\n\n        // Arrow 4 - Final arrow with enhanced glow\n        .fromTo(\".anim-arrow-4\",\n            { strokeDashoffset: 250, autoAlpha: 0, filter: \"blur(5px)\" },\n            { strokeDashoffset: 0, autoAlpha: 1, filter: \"blur(0px)\", duration: 0.9, ease: \"power2.out\" },\n            \"-=0.6\"\n        )\n\n        // Spoke 4 - Final spoke with dramatic entrance\n        .fromTo(\".anim-spoke-4\",\n            { scale: 0, y: -50, rotationX: 90, z: -200, autoAlpha: 0, transformPerspective: 1000 },\n            { scale: 1, y: 0, rotationX: 0, z: 0, autoAlpha: 1, duration: 0.8, ease: \"back.out(2.5)\" },\n            \"-=0.5\"\n        )\n\n        // Footer - Elegant fade with slide\n        .fromTo(\".anim-footer\",\n            { y: 30, autoAlpha: 0, filter: \"blur(3px)\" },\n            { y: 0, autoAlpha: 1, filter: \"blur(0px)\", duration: 0.8, ease: \"power2.out\" },\n            \"-=0.4\"\n        );\n\n        // Continuous Premium Animations\n        \n        // Spokes - Synchronized breathing effect with 3D rotation\n        gsap.to(\".anim-spoke\", {\n            scale: 1.08,\n            rotationY: 5,\n            z: 20,\n            boxShadow: \"0 12px 30px rgba(0,0,0,0.5), 0 0 30px rgba(240,208,0,0.4)\",\n            duration: 2,\n            ease: \"sine.inOut\",\n            stagger: {\n                each: 0.4,\n                repeat: -1,\n                yoyo: true\n            }\n        });\n\n        // Hub - Enhanced pulsing with color shift\n        gsap.to(\".anim-hub\", {\n            scale: 1.05,\n            rotation: 2,\n            borderColor: \"#E01040\",\n            duration: 2.5,\n            ease: \"sine.inOut\",\n            repeat: -1,\n            yoyo: true\n        });\n\n        // Arrows - Continuous stroke width pulse with glow\n        gsap.to(\".anim-arrow\", {\n            strokeWidth: 6,\n            opacity: 0.9,\n            duration: 1.8,\n            ease: \"sine.inOut\",\n            stagger: {\n                each: 0.3,\n                repeat: -1,\n                yoyo: true\n            }\n        });\n\n        // Gradient animation for arrows\n        const gradients = document.querySelectorAll('linearGradient stop');\n        gsap.to(gradients, {\n            attr: { offset: \"+=0.1\" },\n            duration: 2,\n E033]\" style=\"box-shadow: 0 0 20px rgba(255, 224, 51, 0.9), 0 0 40px rgba(255, 224, 51, 0.6);\"></div>\n            <div class=\"w-[120px] h-[6px] bg-[#FF2050]\" style=\"box-shadow: 0 0 20px rgba(255, 32, 80, 0.9), 0 0 40px rgba(255, 32, 80, 0.6);\"></div>\n        </div>\n        \n    </div>\n    \n    <!-- Cinematic Fade Overlay with Gradient -->\n    <div class=\"fade-overlay\"></div>\n    \n</div>\n\n<script>\n    document.addEventListener(\"DOMContentLoaded\", () => {\n        // Create animation timeline\n        const tl = gsap.timeline();\n        \n        // Background shapes animate in with enhanced easing\n        tl.fromTo(\".anim-blue-shape\", \n            { opacity: 0, x: 100, rotationY: -45 }, \n            { opacity: 1, x: 0, rotationY: 0, duration: 1.8, ease: \"power4.out\" }, \n            0\n        );\n        \n        tl.fromTo(\".anim-gray-shape\", \n            { opacity: 0, x: 150, rotationY: 45 }, \n            { opacity: 1, x: 0, rotationY: 0, duration: 1.8, ease: \"power4.out\" }, \n            0.15\n        );\n        \n        // Bottom bars slide in with bounce\n        tl.fromTo(\".anim-yellow-bar\", \n            { scaleX: 0, transformOrigin: \"left\" }, \n            { scaleX: 1, duration: 1.2, ease: \"elastic.out(1, 0.5)\" }, \n            0.4\n        );\n        \n        tl.fromTo(\".anim-red-bar\", \n            { scaleX: 0, transformOrigin: \"left\" }, \n            { scaleX: 1, duration: 1.2, ease: \"elastic.out(1, 0.5)\" }, \n            0.5\n        );\n        \n        // Logo fade and rotate in with enhanced spring\n        tl.fromTo(\".anim-logo\", \n            { opacity: 0, rotation: -25, scale: 0.6 }, \n            { opacity: 1, rotation: 0, scale: 1, duration: 1.5, ease: \"back.out(2)\" }, \n            0.6\n        );\n        \n        // Title appears with enhanced glow\n        tl.fromTo(\".anim-title\", \n            { opacity: 0, y: 50, scale: 0.9 }, \n            { \n                opacity: 1, \n                y: 0, \n                scale: 1, \n                duration: 1.2, \n                ease: \"power3.out\",\n                onComplete: () => {\n                    gsap.to(\".anim-title span\", {\n                        textShadow: \"0 0 20px rgba(255, 224, 51, 1), 0 0 40px rgba(255, 224, 51, 0.9), 0 0 60px rgba(255, 224, 51, 0.7), 0 4px 10px rgba(0, 0, 0, 1)\",\n                        duration: 0.6,\n                        yoyo: true,\n                        repeat: 1\n                    });\n                }\n            }, \n            0.9\n        );\n        \n        // Kicker with dramatic 3D perspective and maximum neon glow pulse\n        tl.fromTo(\".anim-kicker\", \n            { \n                opacity: 0, \n                scale: 0.85, \n                y: 60,\n                rotationX: -15,\n                z: -200\n            }, \n            { \n                opacity: 1, \n                scale: 1, \n                y: 0,\n                rotationX: 0,\n                z: 0,\n                duration: 1.8, \n                ease: \"power4.out\",\n                onComplete: () => {\n                    // Add maximum neon glow class\n                    const kickerText = document.querySelector(\".anim-kicker h1\");\n                    kickerText.classList.add(\"neon-glow-max\");\n                    \n                    // Continuous maximum neon pulse\n                    gsap.to(kickerText, {\n                        textShadow: \"0 0 15px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.9), 0 0 45px rgba(255, 224, 51, 1), 0 0 70px rgba(255, 224, 51, 0.9), 0 0 100px rgba(255, 224, 51, 0.7), 0 0 140px rgba(255, 224, 51, 0.5), 0 6px 12px rgba(0, 0, 0, 1), 0 12px 24px rgba(0, 0, 0, 0.9)\",\n                        duration: 1.2,\n                        yoyo: true,\n                        repeat: 2,\n                        ease: \"sine.inOut\"\n                    });\n                    \n                    // Create particle burst\n                    createParticleBurst();\n                }\n            }, \n            1.4\n        );\n        \n        // Final line with cinematic fade and scale\n        tl.fromTo(\".anim-final\", \n            { \n                opacity: 0, \n                scale: 0.9, \n                y: 40,\n                filter: \"blur(10px)\"\n            }, \n            { \n                opacity: 1, \n                scale: 1, \n                y: 0,\n                filter: \"blur(0px)\",\n                duration: 1.6, \n                ease: \"power3.out\",\n                onComplete: () => {\n                    // Enhanced shimmer effect\n                    gsap.to(\".anim-final p\", {\n                        textShadow: \"0 0 25px rgba(255, 255, 255, 0.8), 0 0 50px rgba(255, 255, 255, 0.6), 0 4px 12px rgba(0, 0, 0, 1), 0 8px 24px rgba(0, 0, 0, 0.9)\",\n                        duration: 0.8,\n                        yoyo: true,\n                        repeat: 1\n                    });\n                }\n            }, \n            2.2\n        );\n        \n        // Accent bars with stagger and enhanced glow\n        tl.fromTo(\".anim-bar > div\", \n            { opacity: 0, scaleX: 0, y: 20 }, \n            { \n                opacity: 1, \n                scaleX: 1, \n                y: 0,\n                duration: 1, \n                ease: \"power3.out\", \n                stagger: 0.2,\n                transformOrigin: \"center\",\n                onComplete: function() {\n                    gsap.to(this.targets()[0], {\n                        boxShadow: \"0 0 40px rgba(255, 224, 51, 1), 0 0 60px rgba(255, 224, 51, 0.7)\",\n                        duration: 0.5,\n                        yoyo: true,\n                        repeat: 1\n                    });\n                    gsap.to(this.targets()[1], {\n                        boxShadow: \"0 0 40px rgba(255, 32, 80, 1), 0 0 60px rgba(255, 32, 80, 0.7)\",\n                        duration: 0.5,\n                        yoyo: true,\n                        repeat: 1\n                    });\n                }\n            }, \n            2.8\n        );\n        \n        // Logo pulse and rotation at the end\n        tl.to(\".anim-logo\", {\n            scale: 1.2,\n            rotation: 5,\n            duration: 0.8,\n            yoyo: true,\n            repeat: 1,\n            ease: \"sine.inOut\"\n        }, 3.8);\n        \n        // Final logo glow (enhanced)\n        tl.to(\".anim-logo\", {\n            filter: \"drop-shadow(0 0 50px rgba(255, 224, 51, 1))\",\n            duration: 1,\n            ease: \"power2.inOut\"\n        }, 4.2);\n        \n        // Cinematic fade to black with smooth gradient transition\n        tl.to(\".fade-overlay\", {\n            opacity: 1,\n            duration: 3,\n            ease: \"power2.inOut\"\n        }, 5);\n        \n        // Function to create particle burst effect\n        function createParticleBurst() {\n            const container = document.getElementById(\"particle-container\");\n            const centerX = 640;\n            const centerY = 300;\n            const particleCount = 40;\n            \n            for (let i = 0; i < particleCount; i++) {\n                const particle = document.createElement(\"div\");\n                particle.className = \"particle\";\n                \n                // Brighter colors from Red Bull palette\n                const colors = [\"#FFE033\", \"#FF2050\", \"#FFFFFF\", \"#4488FF\"];\n                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];\n                particle.style.boxShadow = \"0 0 15px currentColor\";\n                \n                particle.style.left = centerX + \"px\";\n                particle.style.top = centerY + \"px\";\n                container.appendChild(particle);\n                \n                // Random angle and distance\n                const angle = (Math.PI * 2 * i) / particleCount;\n                const distance = 150 + Math.random() * 200;\n                const endX = centerX + Math.cos(angle) * distance;\n                const endY = centerY + Math.sin(angle) * distance;\n                \n                // Animate particle\n                gsap.to(particle, {\n                    x: endX - centerX,\n                    y: endY - centerY,\n                    opacity: 0,\n                    scale: Math.random() * 2 + 0.5,\n                    duration: 1.5 + Math.random() * 0.5,\n                    ease: \"power2.out\",\n                    onComplete: () => {\n                        particle.remove();\n                    }\n                });\n            }\n        }\n    });\n<\/script>\n\n</body></html>"];
        var iframe = document.getElementById('slideFrame');
        var total = SLIDES.length;
        var current = 0;
        var WIDTH = 1280;
        var HEIGHT = 720;

        function fitScale() {
          if (!iframe) return;
          var scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
          iframe.style.transform = 'scale(' + scale + ')';
          iframe.style.transformOrigin = 'center center';
        }

        function show(index) {
          if (index < 0 || index >= total) return;
          current = index;
          iframe.srcdoc = SLIDES[current];
          fitScale();
        }

        function enterFullscreen() {
          var el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
        }

        function exitFullscreen() {
          var doc = document;
          (doc.exitFullscreen || doc.webkitExitFullscreen || doc.webkitCancelFullScreen || doc.mozCancelFullScreen || doc.msExitFullscreen).call(doc);
        }

        function showFullscreenHint() {
          trigger.classList.remove('ready');
        }

        function hideFullscreenHint() {
          trigger.classList.add('ready');
        }

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            exitFullscreen();
            return;
          }
          var trigger = document.getElementById('fullscreenTrigger');
          if (!trigger.classList.contains('ready')) return;
          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (current > 0) show(current - 1); e.preventDefault(); }
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { if (current < total - 1) show(current + 1); e.preventDefault(); }
        });

        function onFullscreenChange() {
          var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
          if (isFs) hideFullscreenHint();
          else showFullscreenHint();
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('mozfullscreenchange', onFullscreenChange);
        document.addEventListener('MSFullscreenChange', onFullscreenChange);

        var trigger = document.getElementById('fullscreenTrigger');
        var overlay = document.getElementById('fullscreenOverlay');
        overlay.addEventListener('click', function(e) {
          if (trigger.classList.contains('ready')) {
            var mid = window.innerWidth / 2;
            if (e.clientX < mid) { if (current > 0) show(current - 1); }
            else { if (current < total - 1) show(current + 1); }
          } else if (e.target === trigger || trigger.contains(e.target)) {
            enterFullscreen();
          }
        });

        window.addEventListener('resize', fitScale);

        show(0);
      })();
